# Elix main config. Validated by src/core/config.ts (zod) at startup.
# Secrets live in .env (gitignored) — never here.

version: 1

bot:
  username: Elix
  # Target server version — a config value, never hard-coded in source.
  # Vendored 26.2 data (protocol 776) from PR #1298; no ViaProxy needed.
  version: "26.2"
  # Only join servers listed here (empty = ask at startup). Protects against
  # accidentally joining a server whose rules don't allow bots.
  serverAllowlist:
    - "145.241.127.222"

server:
  # Default profile — override with --profile <name> or --host/--port.
  profile: main

# Saved server profiles. `elix start --profile <name>` uses these.
profiles:
  main:
    host: 145.241.127.222
    port: 25565
    version: "26.2"
    description: "Main server (offline mode, whitelist on)"

brain:
  # Prompt budgeter caps (see brief §4).
  fastMaxTokens: 1500
  smartMaxTokens: 4000
  timeoutsMs:
    fast: 6000
    smart: 20000
  # Quota saving: no AI calls for combat or movement; cache repeated answers.
  idleChatterBudgetPerHour: 60

voice:
  enabled: false
  # If SVC isn't on the server, push text-only mode instead of failing.
  textOnlyFallback: true

safety:
  # kid-safe | adult (romantic/sexual content is always refused regardless)
  contentLevel: kid-safe
  # Max 1 chat message per 2 seconds.
  chatRateLimitPer2s: 1

  # Quoted verbatim in a CRISIS reply, and only when this is non-empty.
  #
  # There is no default helpline anywhere in the codebase, and none is invented:
  # a made-up phone number sends someone dialling a place that does not exist,
  # which is worse than saying nothing. Left empty, a crisis reply still tells the
  # player to reach a trusted adult or their local emergency services, without
  # naming a number.
  #
  # Set it to YOUR local crisis line if you want one quoted, e.g.
  #   helplineText: "childline on 0800 1111 (UK)"
  helplineText: ""

  # Whether Elix may use emoji. OFF by default.
  #
  # Minecraft's font has no glyph for most emoji, so 🎉 arrives in game as an empty
  # box, and persona.md describes plain lowercase chat. Live replies were observed
  # carrying 🎉🍒 and 🌱✌️. Plain-text faces like :) and :D are unaffected either way.
  allowEmoji: false

# How hard Elix plays. Affects reaction delay, aim and PvP aggression.
#   casual   slow to react, passive, avoids fights
#   normal   the default
#   tryhard  fast reactions, fights back
skillCap: normal

persona: config/persona.md
dataDir: data
logLevel: info
